name: ResuMate Android APK

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'ota/resumate-runtime.js'
      - 'plugins/**'
      - 'android/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumate-android-${{ github.ref }}
  cancel-in-progress: false

env:
  RESUMATE_BUILD: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source layout
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ResuMate.zip ]; then
            rm -rf .resumate-extracted
            mkdir -p .resumate-extracted
            unzip -q ResuMate.zip -d .resumate-extracted
            if [ -f .resumate-extracted/www/app-source.html ]; then
              mkdir -p www
              cp .resumate-extracted/www/app-source.html www/index.html
            elif [ -f .resumate-extracted/app-source.html ]; then
              mkdir -p www
              cp .resumate-extracted/app-source.html www/index.html
            elif [ -f .resumate-extracted/www/index.html ]; then
              mkdir -p www
              cp .resumate-extracted/www/index.html www/index.html
            else
              echo 'No supported ResuMate HTML entry point found in ZIP.'
              find .resumate-extracted -maxdepth 4 -type f -print
              exit 1
            fi
            rm -rf .resumate-extracted ResuMate.zip
          fi
          test -s www/index.html

      - name: Prepare local OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          sha = os.environ['RESUMATE_BUILD']
          with open('ota/version.json', 'w', encoding='utf-8') as f:
              json.dump({'enabled': True, 'version': sha[:12], 'build': sha, 'channel': 'stable'}, f, separators=(',', ':'))
              f.write('\n')
          PY

      - name: Prepare web bundle
        run: npm run build

      - name: Validate web app
        run: npm run check

      - name: Install Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ResuMate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
