name: ResuMate OTA

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'ota/resumate-runtime.js'
      - '.github/workflows/deploy-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumate-ota
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish OTA version manifest
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          sha = os.environ['BUILD_SHA']
          with open('ota/version.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'enabled': True,
                  'version': sha[:12],
                  'build': sha,
                  'channel': 'stable'
              }, f, separators=(',', ':'))
              f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ota/version.json
          if git diff --cached --quiet; then
            echo 'OTA manifest already current.'
          else
            git commit -m 'chore: publish OTA version manifest'
            git push
          fi

      - name: Verify OTA payload
        shell: bash
        run: |
          set -euo pipefail
          test -s www/index.html
          test -s www/resumate-ota-loader.js
          test -s ota/resumate-runtime.js
          test -s ota/version.json
          printf 'OTA payload ready: %s\n' "$(cat ota/version.json)"
