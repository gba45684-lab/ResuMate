name: ResuMate OTA

on:
  push:
    branches: [main]
    paths:
      - 'ota/**'
      - 'www/resumate-ota-loader.js'
      - 'scripts/prepare-web.mjs'
      - '.github/workflows/deploy-ota.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: resumate-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare OTA package
        shell: bash
        run: |
          set -euo pipefail
          test -f ota/index.html
          test -f ota/version.json
          test -f ota/resumate-runtime.js
          mkdir -p _site
          cp -R ota/. _site/
          printf '%s\n' 'OTA package prepared.'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
