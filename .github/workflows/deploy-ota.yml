name: ResuMate OTA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ota/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumate-ota
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Publish OTA version manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          # The OTA build identity must reference the latest real app/source commit,
          # not an ota/version.json commit created by this workflow.
          BUILD_SHA="$(git rev-list --max-count=1 HEAD -- . ':(exclude)ota/**')"
          if [ -z "$BUILD_SHA" ]; then
            echo 'Unable to resolve source build SHA.'
            exit 1
          fi
          RELEASE_SUBJECT="$(git log -1 --pretty=%s "$BUILD_SHA")"
          export BUILD_SHA RELEASE_SUBJECT
          python3 - <<'PY'
          import json, os
          sha = os.environ['BUILD_SHA']
          subject = os.environ.get('RELEASE_SUBJECT', '').strip()
          notes = [subject] if subject else ['Latest ResuMate improvements and fixes.']
          with open('ota/version.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'enabled': True,
                  'version': sha[:12],
                  'build': sha,
                  'channel': 'stable',
                  'releaseNotes': notes
              }, f, separators=(',', ':'))
              f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ota/version.json
          if git diff --cached --quiet; then
            echo 'OTA manifest already current.'
          else
            git commit -m 'chore: publish OTA version manifest'
            git push origin HEAD:main
          fi

      - name: Verify OTA payload
        shell: bash
        run: |
          set -euo pipefail
          test -s www/index.html
          test -s www/resumate-ota-loader.js
          test -s ota/resumate-runtime.js
          test -s ota/version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('ota/version.json').read_text(encoding='utf-8'))
          assert manifest.get('enabled') is True
          assert manifest.get('channel') == 'stable'
          assert manifest.get('build')
          assert manifest.get('build') != manifest.get('version_only_manifest_commit')
          assert manifest.get('version') == manifest['build'][:12]
          print('OTA payload ready:', json.dumps(manifest, separators=(',', ':')))
          PY
